[project]
name = "copilot-backend"
version = "0.1.0"
description = "Copilot backend (FastAPI + LangGraph). See docs/SPEC.md and docs/adr/."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Zhipo Copilot" }]

# Core runtime dependencies. Pinned to known-good versions for MVP scaffold.
# When bumping, record the rationale in docs/adr/ if it affects architecture.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",          # ASGI client for FastAPI tests
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "mypy==1.13.0",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]