[project]
name = "copilot-backend"
version = "0.1.0"
description = "Copilot backend (FastAPI + LangGraph). See docs/SPEC.md and docs/adr/."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Zhipo Copilot" }]

# Core runtime dependencies. Pinned to known-good versions for MVP scaffold.
# When bumping, record the rationale in docs/adr/ if it affects architecture.
# httpx is a runtime dep: the Langfuse health probe (T03 #4) and later Langfuse
# trace upload (T35 #40) both issue HTTPS requests from the backend.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "motor==3.6.0",
    "email-validator>=2.3.0",
    # T05 (#6) — authenticated encryption for stored Tool credentials.
    # `cryptography` is the well-maintained PyCA binding; AES-256-GCM is
    # implemented in constant time inside OpenSSL.
    "cryptography>=42.0.0",
    # T09 (#10) — bcrypt password hashing for the admin local-login
    # path. ADR-0009 keeps the hash at rest; `bcrypt` is the de-facto
    # choice — adaptive cost factor, native constant-time compare, and
    # a stable `$2b$` prefix that survives a future library swap.
    # Upper bound pins the API surface (4.x — `hashpw` / `checkpw` /
    # `gensalt`); a 5.x bump will be a deliberate decision.
    "bcrypt>=4.2.0,<5.0",
    "langchain-openai>=0.2.14,<0.4",
    # T21 / #18 — JSON Schema validation for Tool parameters (ADR-0020).
    # The Worker runs every `parameters` payload through the snapshot's
    # frozen `parameters_schema` before the upstream call so LLM
    # hallucinations never reach the API.
    "jsonschema>=4.23.0,<5.0",
]

[project.optional-dependencies]
# Dev-only extras. mongomock-motor / mongomock drive the hermetic test
# suite (no live MongoDB needed in CI); pytest / mypy / ruff cover the
# usual trio.
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "mypy==1.13.0",
    "ruff==0.8.4",
    "mongomock-motor==0.0.34",
    "mongomock==4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["mongomock_motor", "mongomock", "yaml", "jsonschema"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
